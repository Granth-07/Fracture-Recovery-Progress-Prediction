# ===========================================================================
# .github/workflows/ci.yml
#
# CI: Lint + Build check on every push and pull request.
# No deploy step here. Deploy happens via Render (backend) / Vercel (frontend)
# connected directly to this repo — see /infra/DEPLOY.md.
#
# All secrets are referenced by name only (stored in GitHub → Settings →
# Secrets and variables → Actions). No secret values are written here.
# ===========================================================================

name: CI — Lint & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # -------------------------------------------------------------------------
  # Backend: Python lint + import check
  # -------------------------------------------------------------------------
  backend-lint:
    name: Backend — Lint (ruff) + import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies + linter
        run: |
          pip install --quiet ruff
          pip install --quiet -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/app --output-format=github

      - name: Check imports resolve
        # Ensures no import errors exist without needing a live DB
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_db
          CORS_ORIGINS: http://localhost:3000
          ENV: development
        run: python -c "import app.main" --no-site
        working-directory: backend

  # -------------------------------------------------------------------------
  # Backend: Docker build check (no push)
  # -------------------------------------------------------------------------
  backend-docker-build:
    name: Backend — Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: fracture-recovery-backend:ci

  # -------------------------------------------------------------------------
  # Frontend: TypeScript type-check + build
  # -------------------------------------------------------------------------
  frontend-build:
    name: Frontend — TS check + Vite build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite build
        env:
          # Reference secrets by name — values live in GitHub Secrets
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build
